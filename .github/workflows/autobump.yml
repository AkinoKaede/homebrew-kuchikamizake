name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Run daily at 02:17 UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      casks:
        description: Optional space-separated list of casks to check
        required: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    name: Bump casks
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.08.03.2
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@2026.08.03.2

      - name: Bump casks
        env:
          CASKS: ${{ inputs.casks }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          # Upstream currently does not ship a Gatekeeper-verifiable signature.
          # Keep all autobump audits except the signing audit.
          HOMEBREW_TEST_BOT_AUTOBUMP: 1
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          bump=(brew bump --no-fork --open-pr --casks)

          if [[ -n "${CASKS:-}" ]]; then
            xargs "${bump[@]}" <<<"${CASKS}"
          else
            "${bump[@]}" --tap="${TAP_NAME}"
          fi
