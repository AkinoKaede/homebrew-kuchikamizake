name: Auto-bump casks

on:
  schedule:
    # Run daily at 02:17 UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      casks:
        description: Optional space-separated list of casks to check
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  autobump:
    if: github.event.repository.fork == false
    runs-on: macos-latest
    env:
      HOMEBREW_DEVELOPER: 1

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.07.10.1

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for cask updates
        env:
          CASKS: ${{ inputs.casks }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upstream currently does not ship a Gatekeeper-verifiable signature.
          # Keep all autobump audits except the signing audit.
          HOMEBREW_TEST_BOT_AUTOBUMP: 1
        run: |
          tap="${GITHUB_REPOSITORY/\/homebrew-/\/}"
          bump=(brew bump --no-fork --open-pr --casks)

          if [[ -n "${CASKS:-}" ]]; then
            xargs "${bump[@]}" <<<"${CASKS}"
          else
            "${bump[@]}" --tap="${tap}"
          fi
