name: Test tap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.07.10.1

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax
